changelog:
  exclude:
    labels:
      - skip changelog
    authors:
      - "dependabot[bot]"
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking
    - title: 🚀 New Features
      labels:
        - feature
    - title: ✨ Enhancements
      labels:
        - enhancement
    - title: 📦 Official Package alterations
      labels:
        - package
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🗃️ Meta
      labels:
        - meta
    - title: 🔧 Other Changes
      labels:
        - "*"
