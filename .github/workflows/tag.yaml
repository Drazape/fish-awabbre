name: Tag Version

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    uses: $/.github/workflows/build-nixpkg.yaml
    permissions:
      contents: read
  docs:
    uses: $/.github/workflows/docs.yaml
    permissions:
      contents: read
      pages: write
      id-token: write
  tag:
    name: Tag Version
    needs: [build, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.10.0"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
