on:
  push:
    branches-ignore:
      # already performed on protected branches
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
name: 'Readme: Table of Contents'
jobs:
  generateTOC:
    name: TOC Generator
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: technote-space/toc-generator@v4
        with:
          CREATE_PR: true
          COMMIT_MESSAGE: 'chore(docs): readme: update table of contents'
          PR_BRANCH_PREFIX: 'readme-toc/'
          PR_TITLE: 'chore(docs): readme: update TOC (${PR_MERGE_REF})'
          COMMIT_EMAIL: 'Drazape@outlook.com'
