on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: write
  pull-requests: write
name: TOC Generator
jobs:
  generateTOC:
    name: TOC Generator
    runs-on: ubuntu-latest
    steps:
      - uses: technote-space/toc-generator@v4
        with:
          CREATE_PR: true
          COMMIT_MESSAGE: 'chore(docs): readme: update table of contents'
          PR_BRANCH_PREFIX: 'readme-toc/'
          PR_TITLE: 'chore(docs): readme: update TOC (${PR_MERGE_REF})'
