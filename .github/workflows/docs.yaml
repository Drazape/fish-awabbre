name: Documentation

on:
  push:
    branches-ignore:
      # check already performed on protected branch
      - develop
      - main # ran as a job during release
  pull_request:

jobs:
  docs:
    uses: Drazape/zensical-action/.github/workflows/docs.yaml@main
    permissions:
      contents: read
      pages: write
      id-token: write
